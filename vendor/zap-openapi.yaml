  /message/typing:
    post:
      operationId: setTyping
      summary: Publish a typing / recording indicator, or clear it
      description: 'Sent straight to WhatsApp rather than through the outbox: presence is ephemeral, and
        an indicator replayed after a restart would misreport what the sender is doing. WhatsApp expires
        it on its own, so a caller that dies mid-thought stops showing as typing with no cleanup call.'
      tags:
      - Messages
      security:
      - apiKey: []
      requestBody:
        content:
          application/json:
            example:
              to: 5511999999999@s.whatsapp.net
              state: composing
            schema:
              $ref: '#/components/schemas/TypingRequest'
      responses:
        '204':
          description: Presence published
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: WhatsApp session is not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /message/read:
    post:
      operationId: markRead
      summary: Mark inbound messages as read (blue ticks)
      description: Visible to the other side, so it is an explicit call rather than something the gateway
        does on delivery. Bypasses the outbox for the same reason as presence.
      tags:
      - Messages
      security:
      - apiKey: []
      requestBody:
        content:
          application/json:
            example:
              to: 5511999999999@s.whatsapp.net
              messageIds:
