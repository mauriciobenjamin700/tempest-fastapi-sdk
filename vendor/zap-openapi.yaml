  /message/history/{chat}:
    get:
      operationId: getHistory
      summary: Stored conversation with a number, newest first
      description: Lets a bot rebuild context without keeping its own copy of the history. Accepts either
        the digits or the full JID the inbound webhook delivers. The raw Baileys envelope is never exposed.
      tags:
      - Messages
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          description: Phone digits, or the JID from the inbound webhook
        required: true
        description: Phone digits, or the JID from the inbound webhook
        name: chat
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 200
        required: false
        name: limit
        in: query
      responses:
        '200':
          description: The stored conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Persistence is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/status:
    get:
      operationId: getSessionStatus
      summary: Current WhatsApp session status
      tags:
      - Session
      security:
      - apiKey: []
      responses:
        '200':
          description: The session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/start:
    post:
      operationId: startSession
      summary: Start the WhatsApp connection
      description: 'Idempotent: calling it while already connected returns the current status. `qr` is
        the authenticated URL of the pairing image, not the code itself.'
      tags:
      - Session
      security:
      - apiKey: []
      responses:
        '200':
          description: Connection started (or already running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStartResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/qr:
    get:
      operationId: getSessionQr
      summary: Authenticated URL of the current pairing QR
      tags:
      - Session
      security:
      - apiKey: []
      responses:
        '200':
          description: The QR URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No QR available (already connected, or none generated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/qr/image:
    get:
      operationId: getSessionQrImage
      summary: The pairing QR as a PNG
      description: 'Served `image/png` with `Cache-Control: no-store`. Behind the same API key as everything
        else — the pairing code is never public.'
      tags:
      - Session
      security:
      - apiKey: []
      responses:
        '200':
          description: The QR image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No QR available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /session/disconnect:
    delete:
      operationId: disconnectSession
      summary: Log out and invalidate the session
      description: 'A deliberate logout: the reconnect loop does not undo it. Pairing again requires a
        new QR scan.'
      tags:
      - Session
      security:
      - apiKey: []
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      operationId: health
      summary: Liveness probe — always 200 while the process is up
      description: 'Answers 200 even while WhatsApp is disconnected: the gateway still accepts sends into
        the outbox. Use /ready to gate traffic.'
      tags:
      - Meta
      responses:
        '200':
          description: The process is alive
  /ready:
    get:
      operationId: ready
      summary: Readiness probe — 503 until the WhatsApp session is connected
      tags:
      - Meta
      responses:
        '200':
          description: Session connected
        '503':
          description: Session not connected yet
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics (text exposition format)
      tags:
      - Meta
      responses:
        '200':
          description: Metrics, in the Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
tags:
- name: Messages
  description: 'Sending, reacting, and the signals a conversational bot needs: presence, read receipts
    and stored history.'
- name: Session
  description: Pairing and the lifecycle of the single WhatsApp connection this gateway holds.
- name: Meta
  description: Unauthenticated probes. `/health` is liveness and stays 200 while WhatsApp is down; `/ready`
    is what a load balancer should watch.
