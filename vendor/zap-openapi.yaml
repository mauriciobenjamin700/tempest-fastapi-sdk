openapi: 3.0.0
info:
  title: zap-api
  version: 1.0.0
  description: "WhatsApp gateway. Sends are asynchronous: a `202` means the message was durably enqueued,\
    \ not that WhatsApp has it — delivery is reported on the consumer's status webhook.\n\n## Authentication\n\
    \n**Every endpoint below requires the `x-api-key` header.** On this page it is not a form field: click\
    \ **Authorize** at the top right, paste your key, and it is attached to every request from then on\
    \ (it survives a reload).\n\nA `401 Invalid or missing API key` almost always means that step was\
    \ skipped. No other header authenticates — in particular `Idempotency-Key` does not: it controls retry\
    \ behaviour, nothing else.\n\n## Why POST has no Try it out\n\nOnly `GET` is executable here, on purpose:\
    \ a `POST` on this page would send a real WhatsApp message to a real person, and a documentation page\
    \ is the wrong place to discover that. Copy the request instead:\n\n```bash\ncurl -X POST http://127.0.0.1:3000/message/send-text\
    \ \\\n  -H \"x-api-key: $API_KEY\" \\\n  -H \"Idempotency-Key: $(uuidgen)\" \\\n  -H \"Content-Type:\
    \ application/json\" \\\n  -d '{\"to\":\"5511999999999\",\"text\":\"Oi\"}'\n```\n\nReal-time inbound\
    \ messages arrive over the WebSocket at `/ws`, which OpenAPI cannot describe; see the README for its\
    \ frame protocol."
servers:
- url: /
  description: This gateway
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Per-consumer API key. Header only — there is no query-parameter fallback.
  schemas:
    HistoryMessage:
      type: object
      properties:
        messageId:
          type: string
        direction:
          type: string
          enum:
          - incoming
          - outgoing
        text:
          type: string
          nullable: true
        mediaType:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
      required:
      - messageId
      - direction
      - text
      - mediaType
      - timestamp
    SendTextRequest:
      type: object
      properties:
        to:
          type: string
          pattern: ^\d{10,15}$
        replyTo:
          type: string
          minLength: 1
          maxLength: 128
        text:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - to
      - text
    SendImageRequest:
      type: object
      properties:
        to:
          type: string
          pattern: ^\d{10,15}$
        replyTo:
          type: string
          minLength: 1
          maxLength: 128
        media:
          type: string
          minLength: 1
          maxLength: 8192
        caption:
          type: string
          maxLength: 4096
      required:
      - to
      - media
    SendVideoRequest:
      type: object
      properties:
        to:
          type: string
          pattern: ^\d{10,15}$
        replyTo:
          type: string
          minLength: 1
          maxLength: 128
        media:
          type: string
          minLength: 1
          maxLength: 8192
        caption:
          type: string
          maxLength: 4096
      required:
      - to
      - media
    SendAudioRequest:
      type: object
      properties:
        to:
          type: string
          pattern: ^\d{10,15}$
        replyTo:
          type: string
          minLength: 1
          maxLength: 128
        media:
          type: string
          minLength: 1
          maxLength: 8192
      required:
      - to
      - media
    SendDocumentRequest:
      type: object
      properties:
        to:
          type: string
          pattern: ^\d{10,15}$
        replyTo:
          type: string
          minLength: 1
          maxLength: 128
        media:
          type: string
          minLength: 1
          maxLength: 8192
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[^\\/\x00]+$
      required:
      - to
      - media
      - fileName
    ReactionRequest:
      type: object
      properties:
        to:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^\d{10,15}(@s\.whatsapp\.net)?$
        messageId:
          type: string
          minLength: 1
          maxLength: 128
        emoji:
          type: string
          maxLength: 16
      required:
      - to
      - messageId
      - emoji
    TypingRequest:
      type: object
      properties:
        to:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^\d{10,15}(@s\.whatsapp\.net)?$
        state:
          type: string
          enum:
          - composing
          - recording
          - paused
      required:
      - to
      - state
    ReadRequest:
      type: object
      properties:
        to:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^\d{10,15}(@s\.whatsapp\.net)?$
        messageIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          minItems: 1
          maxItems: 100
      required:
      - to
      - messageIds
    AcceptedResponse:
      type: object
      properties:
        id:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          enum:
          - queued
          - sending
          - sent
          - delivered
          - read
          - failed
          - null
        deduped:
          type: boolean
      required:
      - id
      - status
      - deduped
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    SessionStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - disconnected
          - connecting
          - connected
      required:
      - status
    SessionStartResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - disconnected
          - connecting
          - connected
        qr:
          type: string
          nullable: true
      required:
      - status
      - qr
    QrResponse:
      type: object
      properties:
        qr:
          type: string
      required:
      - qr
    CheckNumberResponse:
      type: object
      properties:
        number:
          type: string
        exists:
          type: boolean
        jid:
          type: string
          nullable: true
      required:
      - number
      - exists
      - jid
    HistoryResponse:
      type: object
      properties:
        chat:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/HistoryMessage'
      required:
      - chat
      - messages
  parameters: {}
paths:
  /message/send-text:
    post:
      operationId: sendText
      summary: Enqueue a text message
      tags:
      - Messages
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          maxLength: 255
          description: 'Optional. Guards against a retry becoming a duplicate message.


            Because the send is asynchronous, a lost `202` leaves you unable to tell whether the message
            was enqueued. Send a fresh key (a UUID) with each new message, and reuse that same key when
            retrying it: the second call returns the original row with `deduped: true` instead of enqueueing
            a second message. The key is scoped to your consumer, and stays claimed for as long as the
            row exists — so reusing an old key for a *new* message answers `deduped: true` and sends nothing.


            This header does not authenticate. Auth is `x-api-key` (Authorize, top right).'
        required: false
        description: 'Optional. Guards against a retry becoming a duplicate message.


          Because the send is asynchronous, a lost `202` leaves you unable to tell whether the message
          was enqueued. Send a fresh key (a UUID) with each new message, and reuse that same key when
          retrying it: the second call returns the original row with `deduped: true` instead of enqueueing
          a second message. The key is scoped to your consumer, and stays claimed for as long as the row
          exists — so reusing an old key for a *new* message answers `deduped: true` and sends nothing.


          This header does not authenticate. Auth is `x-api-key` (Authorize, top right).'
        name: idempotency-key
        in: header
      requestBody:
        content:
          application/json:
            example:
              to: '5511999999999'
              text: Seu pedido saiu para entrega.
            schema:
              $ref: '#/components/schemas/SendTextRequest'
      responses:
        '202':
          description: 'Accepted and enqueued. The message is dispatched asynchronously; status transitions
            arrive on the consumer webhook.


            A gateway running without persistence (`DATABASE_URL` unset) sends inline instead of enqueueing,
            and answers this same status and body with `id` and `status` null — there is no outbox row
            to name or to report a status for. It is the only case where they are null, and the reason
            the fields are nullable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded for this consumer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
