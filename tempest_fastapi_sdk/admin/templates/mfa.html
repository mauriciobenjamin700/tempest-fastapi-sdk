{% extends "base.html" %}
{% block title %}{{ t("mfa.title") }} · {{ site.title }}{% endblock %}
{% block content %}
<section class="tempest-admin-login">
  <h1>{{ t("mfa.heading") }}</h1>
  <p>{{ t("mfa.lead") }}</p>
  {% if error %}
  <p class="tempest-admin-login__error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('admin_mfa_submit') }}" class="tempest-admin-login__form">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label>
      <span>{{ t("mfa.code") }}</span>
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9 -]*" maxlength="16" required autofocus>
    </label>
    <button type="submit" class="tempest-admin-btn tempest-admin-btn--block">{{ t("mfa.verify") }}</button>
  </form>
</section>
{% endblock %}
