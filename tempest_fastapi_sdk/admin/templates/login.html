{% extends "base.html" %}
{% block title %}Sign in · {{ site.title }}{% endblock %}
{% block content %}
<section class="tempest-admin-login">
  <div class="tempest-admin-login__brand">
    {% if site.theme.logo_url %}
    <img src="{{ site.theme.logo_url }}" alt="{{ site.theme.logo_alt }}" class="tempest-admin-login__logo">
    {% else %}
    <span class="tempest-admin-mark tempest-admin-mark--lg" aria-hidden="true">{{ site.brand_text[:1] }}</span>
    <span>{{ site.brand_text }}</span>
    {% endif %}
  </div>
  <h1>Sign in</h1>
  <p class="tempest-admin-login__subtitle">{{ site.index_subtitle }}</p>
  {% if error %}
  <p class="tempest-admin-login__error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('admin_login') }}" class="tempest-admin-login__form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      <span>Email</span>
      <input type="email" name="identifier" autocomplete="username" required autofocus>
    </label>
    <label>
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="tempest-admin-btn tempest-admin-btn--block">Sign in</button>
  </form>
</section>
{% endblock %}
