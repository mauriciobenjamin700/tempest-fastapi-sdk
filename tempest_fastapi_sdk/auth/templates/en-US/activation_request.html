{% extends "_auth_layout.html" %}
{% block lang %}en-US{% endblock %}
{% block title %}Resend activation{% endblock %}
{% block content %}
  <h1>Resend activation</h1>
  <p>Enter the account's e-mail and we will send a new activation link.</p>
  {% if error %}<p class="auth-alert" role="alert" id="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ prefix }}/activation/request{{ lang_query }}" class="auth-form" novalidate>
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
    <div class="auth-field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required{% if error %} aria-invalid="true" aria-describedby="form-error"{% endif %} autofocus>
    </div>
    <button type="submit" class="auth-button">Resend link</button>
  </form>
  <nav class="auth-links"><a href="{{ prefix }}/login{{ lang_query }}">Back to sign in</a></nav>
{% endblock %}
