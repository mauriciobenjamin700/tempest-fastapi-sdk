{% extends "_auth_layout.html" %}
{% block lang %}en{% endblock %}
{% block title %}Two-step verification{% endblock %}
{% block content %}
  <h1>Two-step verification</h1>
  <p>Enter the code from your authenticator app or a recovery code.</p>
  {% if error %}<p class="auth-alert" role="alert" id="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ prefix }}/login/mfa{{ lang_query }}" class="auth-form" novalidate>
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="auth-field">
      <label for="code">Code</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required{% if error %} aria-invalid="true" aria-describedby="form-error"{% endif %} autofocus>
    </div>
    <button type="submit" class="auth-button">Verify</button>
  </form>
  <nav class="auth-links"><a href="{{ prefix }}/login{{ lang_query }}">Back to sign in</a></nav>
{% endblock %}
