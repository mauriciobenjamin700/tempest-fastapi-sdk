{% extends "_auth_layout.html" %}
{% block lang %}en-US{% endblock %}
{% block title %}Sign in{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  {% if error %}<p class="auth-alert" role="alert" id="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ prefix }}/login{{ lang_query }}" class="auth-form" novalidate>
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="auth-field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required{% if error %} aria-invalid="true" aria-describedby="form-error"{% endif %} autofocus>
    </div>
    <div class="auth-field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required{% if error %} aria-invalid="true" aria-describedby="form-error"{% endif %}>
    </div>
    <button type="submit" class="auth-button">Sign in</button>
  </form>
  <nav class="auth-links">
    {% if signup_enabled %}<a href="{{ prefix }}/signup{{ lang_query }}">No account? Sign up</a>{% endif %}
    <a href="{{ prefix }}/activation/request{{ lang_query }}">Didn't get the activation e-mail?</a>
  </nav>
{% endblock %}
