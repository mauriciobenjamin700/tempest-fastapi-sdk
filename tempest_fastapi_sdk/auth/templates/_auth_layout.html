<!DOCTYPE html>
<html lang="{% block lang %}pt-BR{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  {% block styles %}
  <style>
    :root { color-scheme: light dark; --auth-accent: #2563eb; --auth-error: #b91c1c; --auth-muted: #4b5563; --auth-border: #d1d5db; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; max-width: 420px; margin: 0 auto; padding: 24px 16px; }
    .auth-page h1 { font-size: 1.5rem; margin: 0 0 8px; }
    .auth-page p { color: var(--auth-muted); }
    .auth-form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
    .auth-field { display: flex; flex-direction: column; gap: 4px; }
    .auth-field label { font-size: 0.875rem; font-weight: 600; }
    .auth-field input { padding: 10px; border: 1px solid var(--auth-border); border-radius: 6px; font-size: 1rem; }
    .auth-field input[aria-invalid="true"] { border-color: var(--auth-error); }
    .auth-field-hint { color: var(--auth-muted); font-size: 0.8125rem; }
    .auth-field-error, .auth-alert { color: var(--auth-error); font-size: 0.875rem; }
    .auth-alert { background: color-mix(in srgb, var(--auth-error) 12%, transparent); padding: 12px; border-radius: 6px; }
    .auth-checkbox { flex-direction: row; align-items: center; gap: 8px; }
    .auth-button { padding: 12px 24px; background: var(--auth-accent); color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .auth-button:focus-visible, .auth-field input:focus-visible { outline: 2px solid var(--auth-accent); outline-offset: 2px; }
    .auth-links { display: flex; flex-direction: column; gap: 4px; margin-top: 20px; font-size: 0.875rem; }
  </style>
  {% endblock %}
</head>
<body>
  <main class="auth-page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
