site_name: tempest-fastapi-sdk
site_description: >-
  Shared FastAPI/SQLAlchemy/Pydantic building blocks for Tempest projects —
  base schemas, async repository, exceptions, pagination, settings, admin,
  Web Push, Server-Sent Events, FastStream/TaskIQ brokers and Brazilian
  document/phone validation.
site_url: https://mauriciobenjamin700.github.io/tempest-fastapi-sdk/
repo_url: https://github.com/mauriciobenjamin700/tempest-fastapi-sdk
repo_name: mauriciobenjamin700/tempest-fastapi-sdk
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Mauricio Benjamin — MIT License

theme:
  name: material
  language: pt-BR
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# Emite /llms.txt + /llms-full.txt (convenção llmstxt.org) a partir do
# markdown-fonte PT, no on_post_build. Hook próprio em vez do plugin
# mkdocs-llmstxt porque este conflita com o mkdocs-static-i18n (reset de
# estado por locale zera as páginas coletadas).
hooks:
  - mkdocs_hooks/llmstxt.py
  - mkdocs_hooks/reference_top.py

# docs/CLAUDE.md são instruções de agente sobre como escrever a documentação,
# não uma página do site. Fica em docs/ para o Claude Code carregá-lo ao abrir
# arquivo de lá, e sai do build — sem espelho .en.md e sem entrada no nav.
exclude_docs: |
  CLAUDE.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # Seletor de idioma PT-BR / EN-US no header. Arquivos sem sufixo são PT
  # (default); traduções vivem em `<nome>.en.md`. Páginas sem tradução caem
  # para o PT (fallback_to_default).
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt
          name: Português (BR)
          default: true
          build: true
        - locale: en
          name: English (US)
          build: true
          site_name: tempest-fastapi-sdk
          nav:
            - Home: index.md
            - Installation:
              - installation.md
              - Install uv: getting-started/uv.md
