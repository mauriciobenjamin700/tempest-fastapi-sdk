name: Dependency audit

# Fails when any dependency in the committed uv.lock (every extra) has a
# known advisory (#436). It runs daily, not on pushes or PRs -- the repo's CI
# only publishes; checks run locally, and `make release` runs `make audit`. The schedule stays because a new advisory lands without
# anyone pushing: the lock that was clean yesterday is not clean today, and
# this run is what says so before the next release does. The release
# workflow runs the same target before it builds.
#
# The ignore list, and the reason behind each ignored ID, live in the
# Makefile's `audit` target, so CI, release and `make audit` agree.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (uv.lock, all extras)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Audit locked dependencies for known vulnerabilities
        run: make audit

      - name: Write the audit record
        if: always()
        run: make audit AUDIT_ARGS="--format json --output $RUNNER_TEMP/pip-audit.json" || true

      - name: Archive the audit record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pip-audit
          path: ${{ runner.temp }}/pip-audit.json
          if-no-files-found: warn
