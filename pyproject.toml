    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "accelerate",
    "accelerate.*",
    "trafilatura",
    "trafilatura.*",
    "pymupdf",
    "fitz",
    "faster_whisper",
    "faster_whisper.*",
    "TTS",
    "TTS.*",
    "pyotp",
    "pyotp.*",
    "ort_vision_sdk",
    "ort_vision_sdk.*",
    "chromadb",
    "chromadb.*",
    "lmformatenforcer",
    "lmformatenforcer.*",
    "rank_bm25",
    "rank_bm25.*",
    "onnxruntime",
    "onnxruntime.*",
    "onnx",
    "onnx.*",
    "onnxscript",
    "onnxscript.*",
    "bitsandbytes",
    "bitsandbytes.*",
    "tokenizers",
    "tokenizers.*",
    "PIL",
    "PIL.*",
    "torchvision",
    "torchvision.*",
    "skl2onnx",
    "skl2onnx.*",
    "sklearn",
    "sklearn.*",
    "joblib",
    "joblib.*",
    "diffusers",
    "diffusers.*",
    "yaml",
    "yaml.*",
    "weasyprint",
    "weasyprint.*",
    "sherpa_onnx",
    "sherpa_onnx.*",
]
ignore_missing_imports = true

# numpy (pulled in transitively via ort-vision-sdk) ships stubs that use
# the 3.12+ ``type X = ...`` statement, which mypy rejects while targeting
# python_version 3.11. We never type-check against numpy internals, so skip
# following its stubs entirely.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=tempest_fastapi_sdk",
    "--cov-report=term-missing",
    "-m",
    "not model and not gpu and not docker",
]
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "model: needs real model weights; opt-in, downloads on first run (make test-model)",
    "gpu: needs CUDA; skipped without a GPU (make test-gpu)",
    "docs: asserts against the built MkDocs site; triggers one `mkdocs build`",
    "docker: starts a real container; opt-in, needs a running daemon (make test-docker)",
]

[tool.coverage.run]
source = ["tempest_fastapi_sdk"]
branch = true
# Async FastAPI handlers run under anyio worker threads / greenlets when
# driven by the ASGI test client; without this the tracer misses their
# bodies and every router handler is under-reported as uncovered.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
