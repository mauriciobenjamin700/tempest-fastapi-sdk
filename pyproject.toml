[project]
name = "tempest-fastapi-sdk"
version = "0.283.0"
description = "Shared FastAPI building blocks: base schemas, ORM model, async repository, exceptions, pagination and settings — the conventions used across Tempest projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mauricio Benjamin", email = "mauricio.benjamin@reloverelations.com" },
]
keywords = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "async",
    "repository",
    "pagination",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.19.1",
    # The quality gate (`tempest lint` / `check` / `pr-prompt`) lives in
    # this framework-agnostic package. It is a dependency and not a copy
    # so both CLIs expose one implementation; it pulls only `typer`,
    # which the SDK already requires.
    "tempest-cli>=0.3.0",
    "click>=8.5.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "typer>=0.27.2",
]

