    "torch>=2.14.0",
    "accelerate>=1.14.0",
    "safetensors>=0.8.0",
    "huggingface-hub>=0.36.2",
]
genai-quant = [
    "bitsandbytes>=0.50.2",
]
genai-rag = [
    "httpx>=0.28.1",
    "trafilatura>=2.2.0",
    "pymupdf>=1.28.2",
    "pgvector>=0.5.0",
    "rank-bm25>=0.2.2",
]
genai-audio = [
    "faster-whisper>=1.2.1",
    "coqui-tts>=0.27.5",
    # coqui-tts keeps its own runtime behind its extras ([cpu]/[cuda]/[codec]),
    # so installing it alone gives a TTS that refuses to import. Measured with
    # coqui-tts 0.27.5 and torch 2.13.0: without torchaudio, `import TTS.api`
    # dies with `ModuleNotFoundError: No module named 'torchaudio'`, and
    # TTS/__init__.py makes torchcodec mandatory once torch >= 2.9.
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.16.0",
    # `import TTS.api` eagerly loads TTS.tts.layers.tortoise.autoregressive,
    # which does `from transformers.pytorch_utils import isin_mps_friendly`.
    # Measured: that symbol is present in transformers 5.0.0 and gone from
    # 5.1.0 on, so any fresh resolve breaks the import. The upper bound is
    # confined to this extra, and 5.0.0 is not carved out because it is the
    # only 5.x that would work.
    #
    # Re-measured 2026-09-02 against the newest coqui-tts (0.27.5) with
    # transformers 5.16.1 and torch 2.14.0: the import still dies with
    # `ImportError: cannot import name 'isin_mps_friendly' from
    # 'transformers.pytorch_utils'`, so the bound is still load-bearing.
    #
    # What it costs, traced the same day: transformers 4.57.6 declares
    # `huggingface-hub<1.0` and `tokenizers<=0.23.0`, which holds this lock's
    # hub at 0.36.2 and tokenizers at 0.22.2 -- and diffusers 0.40.0 requires
    # `huggingface-hub>=1.23.0`, so [genai-image] is held at 0.39.0 too. One
    # bound, four packages. Only the lock is affected: a consumer installing
    # [genai-image] without [genai-audio] resolves diffusers 0.40.0 fine.
    "transformers<5",
]
genai-diarization = [
    "sherpa-onnx>=1.13.7",
    # sherpa-onnx ships the Python wrapper and keeps the compiled
    # libraries (including libonnxruntime.so) in sherpa-onnx-core. Its
    # wheels declare that dependency but its sdist metadata does not,
    # and uv locks from the sdist -- so `uv sync` installs the wrapper
    # alone and the first call dies with
    # `ImportError: libonnxruntime.so: cannot open shared object file`.
    # Naming it here is what makes the extra installable; do not drop
    # it as redundant. The version stays open because sherpa-onnx pins
    # the exact match itself.
    "sherpa-onnx-core",
    "numpy>=2.4.6",
]
faces = [
    "onnxruntime>=1.29.0",
    "pillow>=12.3.0",
    "numpy>=2.4.6",
]
genai-ollama = [
    "httpx>=0.28.1",
]
genai-chroma = [
    "chromadb>=1.5.9",
]
genai-structured = [
    "lm-format-enforcer>=0.11.3",
]
genai-onnx = [
    "onnxruntime>=1.29.0",
    "tokenizers>=0.22.2",
]
genai-vlm = [
