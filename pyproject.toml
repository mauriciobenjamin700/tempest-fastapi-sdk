]
firebase = [
    # Verifying a Firebase ID token has a long correctness tail (certificate
    # rotation, iss/aud/sub, revocation, tenants), so this is the official
    # Google package rather than a reimplementation. It is heavy -- it pulls
    # grpcio, protobuf, google-api-core, google-auth and the Firestore /
    # Storage clients, 33 packages measured on firebase-admin 7.5.0 -- which
    # is why it is an opt-in extra, is imported lazily at FirebaseAuth
    # construction time, and stays out of [all].
    "firebase-admin>=7.5.0",
]
