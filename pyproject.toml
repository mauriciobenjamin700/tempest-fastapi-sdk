[tool.ruff]
line-length = 88
target-version = "py311"
src = [".", "tests"]
# ruff 0.16 started formatting code blocks inside Markdown. Left off here:
# the docs deliberately align trailing comments into columns for teaching,
# which the formatter collapses, and enabling it would rewrite 104 pages in
# a diff unrelated to whatever change turns it on. The blocks are not
# unchecked -- tests/test_docs_examples_*.py parse every one of them and
# assert they are self-contained and free of module-level await.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM",
    "RUF",
    "ANN",
]
ignore = [
    "B008",
    "B006",
    "UP046",
    # ``Any`` is a legitimate annotation. We enforce that things ARE
    # annotated, never that they avoid ``Any`` -- so ANN401 stays off.
    "ANN401",
    # ``*args`` / ``**kwargs`` annotations add noise for the thin
    # passthrough wrappers the SDK exposes.
    "ANN002",
    "ANN003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"**/__init__.py" = ["F401"]
"tempest_fastapi_sdk/db/repository.py" = ["UP006", "UP035"]
# Renders YAML compose snippets as f-string literals — long lines
# (healthcheck commands, `mc` entrypoints) are content, not code.
"tempest_fastapi_sdk/cli/docker_compose.py" = ["E501"]
# `__all__` lists the 373 generated OpenPix names so a strict type-checker
# accepts them as re-exports; they reach the module through the
# TYPE_CHECKING star import, which is exactly what F405 reports.
"tempest_fastapi_sdk/integrations/payment/openpix/__init__.py" = ["F405"]
"tempest_fastapi_sdk/integrations/payment/mercado_pago/__init__.py" = ["F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]

# `init_typed` makes the plugin type each model constructor argument with the
# field's annotation instead of `Any`; without it no schema construction in
# this package is checked at all.
[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "aiosmtplib.*",
    "aiofiles.*",
    "aiofiles",
    "pywebpush",
    "pywebpush.*",
    "firebase_admin",
    "firebase_admin.*",
